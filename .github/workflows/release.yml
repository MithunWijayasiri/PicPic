name: "Release: Publish version"

run-name: "Release v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.1.1 (the tag becomes v0.1.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got: $env:VERSION" }
          if ($env:REF -ne "refs/heads/master") { throw "Run this workflow from the master branch." }
          gh api "repos/${{ github.repository }}/git/ref/tags/v$env:VERSION" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Tag v$env:VERSION already exists." }
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained single-file
        run: >
          dotnet publish PicPic/PicPic.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ inputs.version }}
          -o publish/self-contained
      - name: Publish framework-dependent
        run: >
          dotnet publish PicPic/PicPic.csproj -c Release -r win-x64
          --self-contained false
          -p:DebugType=none
          -p:Version=${{ inputs.version }}
          -o publish/framework-dependent
      - name: Add icon beside the single-file exe
        shell: pwsh
        run: Copy-Item assets/picpic.ico publish/self-contained/picpic.ico
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $tag = "v$env:VERSION"
          Compress-Archive -Path publish/self-contained/* -DestinationPath "PicPic-$tag-win-x64-self-contained.zip"
          Compress-Archive -Path publish/framework-dependent/* -DestinationPath "PicPic-$tag-win-x64-framework-dependent.zip"
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $tag = "v$env:VERSION"
          $ghArgs = @($tag) + (Get-ChildItem PicPic-*.zip | ForEach-Object Name) + @('--target', '${{ github.sha }}', '--title', $tag, '--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
