name: "PR: Title check"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+' <<< "$TITLE"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add X' or 'fix(viewer): Y'. Got: $TITLE"
            exit 1
          fi
