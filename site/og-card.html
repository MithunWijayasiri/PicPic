<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PicPic — social card (1200×630)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    /* Rasterize: msedge --headless=new --screenshot=assets/og-card.png --window-size=1200,630 --hide-scrollbars --virtual-time-budget=8000 "<path or URL to this file>" */
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      display: grid;
      place-items: center;
      align-content: center;
      text-align: center;
      background:
        radial-gradient(60% 42% at 12% -4%, rgba(255, 61, 110, .06), transparent 62%),
        radial-gradient(48% 36% at 88% 6%, rgba(255, 225, 77, .08), transparent 62%),
        radial-gradient(50% 38% at 50% 108%, rgba(34, 211, 255, .05), transparent 66%),
        #ECE7DE;
      color: #1C1A17;
      font: 500 16px/1.6 "Plus Jakarta Sans", system-ui, sans-serif;
    }
    .mark { width: 110px; height: 110px; border-radius: 26px; margin-bottom: 30px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 11px 24px;
      margin-bottom: 34px;
      border: 1px solid #DCD6CA;
      border-radius: 999px;
      background: #F2EEE6;
      color: #676151;
      font: 500 19px "JetBrains Mono", monospace;
      text-transform: uppercase;
      letter-spacing: .16em;
    }
    .pill i { width: 10px; height: 10px; border-radius: 50%; background: #FF3D6E; }
    h1 { font: 800 110px/1.02 "Plus Jakarta Sans", system-ui, sans-serif; letter-spacing: -.03em; margin: 0 0 24px; }
    h1 span { color: #BE1250; }
    p { margin: 0 auto; color: #676151; font-size: 29px; font-weight: 500; }
    .strip {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 38px;
      color: #676151;
      font: 500 19px "JetBrains Mono", monospace;
      text-transform: uppercase;
      letter-spacing: .14em;
    }
    .strip b { color: #1C1A17; }
    .strip .x { color: #B3AD9F; }
  </style>
</head>
<body>
  <img class="mark" src="assets/picpic-mark.svg" alt="">
  <div>
    <p class="pill"><i></i>Free &amp; open source · GPL-3.0</p>
    <h1>View image, <span>instantly.</span></h1>
    <p>A fast, minimal image viewer for Windows —<br>19 formats, basic editing, picture-in-picture and plugins.</p>
    <div class="strip"><b>Windows</b><span class="x">/</span>.NET 8<span class="x">/</span>19 formats</div>
  </div>
</body>
</html>
